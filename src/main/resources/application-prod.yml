spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
  flyway:
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

attendance:
  security:
    cookie-secure: ${APP_COOKIE_SECURE:true}
  biometrics:
    provider: ${ATTENDANCE_BIOMETRICS_PROVIDER:onnx}
    production-enabled: ${ATTENDANCE_PRODUCTION_BIOMETRICS_ENABLED:false}
    encryption-key-b64: ${BIOMETRICS_ENCRYPTION_KEY_B64}
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    admin-username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
