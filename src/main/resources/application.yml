spring:
  application:
    name: mec-team-attendance
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

attendance:
  biometrics:
    provider: ${ATTENDANCE_BIOMETRICS_PROVIDER:mock}
    production-enabled: ${ATTENDANCE_PRODUCTION_BIOMETRICS_ENABLED:false}
    embedding-dimension: ${ATTENDANCE_BIOMETRICS_EMBEDDING_DIM:128}
    match-threshold: ${ATTENDANCE_BIOMETRICS_MATCH_THRESHOLD:0.363}
    max-image-bytes: ${ATTENDANCE_BIOMETRICS_MAX_IMAGE_BYTES:5242880}
    encryption-key-b64: ${BIOMETRICS_ENCRYPTION_KEY_B64:}
    key-version: ${BIOMETRICS_KEY_VERSION:v1}
    yunet-model-path: ${ATTENDANCE_BIOMETRICS_YUNET_MODEL_PATH:models/face_detection_yunet_2023mar.onnx}
    sface-model-path: ${ATTENDANCE_BIOMETRICS_SFACE_MODEL_PATH:models/face_recognition_sface_2021dec.onnx}
  security:
    cookie-secure: ${APP_COOKIE_SECURE:false}
    worker-session-ttl-days: 30
    verification-token-ttl-seconds: 120
  defaults:
    timezone: ${ATTENDANCE_DEFAULT_TIMEZONE:Asia/Kolkata}
    proxy-cap: ${ATTENDANCE_DEFAULT_PROXY_CAP:1}
