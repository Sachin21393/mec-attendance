name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check frontend JavaScript
        run: |
          node --check src/main/resources/static/shared/api.js
          node --check src/main/resources/static/worker/worker.js
          node --check src/main/resources/static/admin/admin.js
          node --check src/main/resources/static/service-worker.js

      - name: Build, migrate, and run all tests
        run: ./mvnw -B clean verify
