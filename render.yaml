services:
  - type: web
    name: workforce-attendance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workforce-attendance-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: ATTENDANCE_BIOMETRICS_PROVIDER
        value: onnx
      - key: ATTENDANCE_PRODUCTION_BIOMETRICS_ENABLED
        value: "true"
      - key: BIOMETRICS_ENCRYPTION_KEY_B64
        generateValue: true
      - key: ADMIN_BOOTSTRAP_ENABLED
        value: "true"
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: ATTENDANCE_DEFAULT_TIMEZONE
        value: Asia/Kolkata

databases:
  - name: workforce-attendance-db
    plan: free
    databaseName: attendance
    user: attendance
