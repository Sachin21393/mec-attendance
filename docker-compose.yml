services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendance_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - attendance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance} -d ${POSTGRES_DB:-attendance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendance_pg_data:
